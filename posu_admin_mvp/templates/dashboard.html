{% extends "base.html" %}
{% block title %}儀表板 | 社團系統{% endblock %}
{% block content %}
<header class="page-header">
  <h1>歡迎使用系統</h1>
</header>
<section class="module-grid">
  {% for module in modules %}
    <a class="module-card-link" href="{{ module['url'] }}">
      <article class="module-card">
        <div class="module-icon">◉</div>
        <div>{{ module['name'] }}</div>
      </article>
    </a>
  {% endfor %}
</section>
{% endblock %}
