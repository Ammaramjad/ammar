<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}社團系統{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <div class="app-layout">
      {% if g.user %}
      <aside class="sidebar">
        <div class="brand">社團達人展示</div>
        <nav>
          <a href="{{ url_for('dashboard') }}">儀表板</a>
          <a href="{{ url_for('members') }}">會員資料</a>
        </nav>
        <div class="sidebar-footer">
          <div>{{ g.user["display_name"] }}</div>
          <a href="{{ url_for('logout') }}">登出</a>
        </div>
      </aside>
      {% endif %}
      <main class="content {% if not g.user %}auth-content{% endif %}">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="flash-wrap">
              {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
